# Render blueprint — deploys the whole app (Express API + built SPA) as one
# web service. Create it from the Render dashboard: New + → Blueprint, pick
# this repo, then fill in the sync:false env vars (MONGODB_URI, ADMIN_*).
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: skitchenpoint
    runtime: node
    plan: free
    region: singapore # closest free region to Gujarat, India
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # redeploys on every push to main
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string (free M0 cluster):
      # mongodb+srv://<user>:<password>@<cluster>.mongodb.net/skfurniture
      - key: MONGODB_URI
        sync: false
      # Admin login for /admin — use a strong password!
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public URL of this service, e.g. https://skitchenpoint.onrender.com
      # (Render injects RENDER_EXTERNAL_URL automatically; this is a fallback.)
      - key: PUBLIC_API_BASE
        sync: false
